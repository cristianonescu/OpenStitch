name: Rust workspace

# Pull requests: fmt, build, test and clippy on macOS, Windows and Linux.
# Push to main (a merged PR): the same checks, then executables for all three OSes as
# workflow artifacts (see build-executables.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels that PR's run still in progress, which frees the scarce
# macOS runners. Every other run (main, tags, release.yml's call) has its own group and is never
# cancelled.
concurrency:
  group: rust-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # File and line numbers in backtraces, without full debug info: smaller test binaries, faster
  # linking (Windows PDBs) and a smaller cache. Debug assertions and overflow checks are unchanged.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Only main saves the cache; pull requests restore main's. The repository's 10 GB of
      # Actions cache held ~1 GB per OS per PR, which evicted main's own entries (#357). A main
      # run whose tests fail still saves its compiled dependencies.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # eframe loads X11/Wayland libraries at run time (dlopen), so Linux needs no -dev packages
      # to build; the editor's tests do not open a window.
      - run: cargo fmt --all -- --check
      # Disk headroom on the Linux runner (#339): free space and the size of target/ and ~/.cargo,
      # before the build and after the last step, in the job summary.
      - name: Disk usage (before the build)
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          { echo "### Disk usage before the build"; echo '```'; df -h /; du -sh target ~/.cargo 2>/dev/null || true; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - run: cargo build --workspace --all-targets --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      # Tests delete their temp folders (#366). On Linux they run with an empty TMPDIR, which is
      # checked after the tests.
      - name: Empty temp folder for the tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/tests" && echo "TMPDIR=$RUNNER_TEMP/tests" >> "$GITHUB_ENV"
      # nextest runs the tests of every binary at once, each test in its own process (cargo test
      # runs the ~90 binaries one after another). It does not run doctests, so they follow.
      - run: cargo nextest run --workspace --locked
      - run: cargo test --doc --workspace --locked
      # The Explorer thumbnail extension (#669): its own project outside the workspace (COM needs
      # unsafe code), so the workspace's clippy and tests do not reach it.
      - name: Explorer thumbnails (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cargo clippy --locked --all-targets --manifest-path packaging/windows/thumbnails/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path packaging/windows/thumbnails/Cargo.toml
      # #705: the app's binary tests crashed on macOS now and then when they ran on several
      # threads of one process (nextest runs each test in its own process, so it cannot show
      # it). Three threaded runs here as evidence for the fix; drop once it has stayed green.
      - name: App binary tests, threaded, three times (#705)
        if: matrix.os == 'macos-latest'
        run: for i in 1 2 3; do cargo test -p openstitch-app --bin openstitch --locked || exit 1; done
      # The Python package (#498): installed from python/, imported outside the repository, then
      # its tests against the debug stitchtool just built (same PES bytes as `stitchtool exec`).
      - name: Python package
        shell: bash
        run: |
          python -m pip install ./python
          (cd "$RUNNER_TEMP" && python -c "import openstitch; print(openstitch.__version__)")
          python -m unittest discover -s python/tests -v
      # The Assistant's keys in the real system keychain (#401): a dummy key under a throwaway
      # service name is saved, read back and removed through openstitch_app::keys. Linux needs a
      # Secret Service, so a headless gnome-keyring runs in its own D-Bus session.
      - name: Keychain round trip (dummy key)
        if: matrix.os != 'ubuntu-latest'
        run: 'cargo test -p openstitch-app --test integration --locked -- --ignored keychain::'
      - name: Keychain round trip (dummy key, Secret Service)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-daemon >/dev/null
          dbus-run-session -- bash -c 'echo -n ci-only | gnome-keyring-daemon --unlock --components=secrets >/dev/null && cargo test -p openstitch-app --test integration --locked -- --ignored keychain::'
      # The editor's assistant scratch folders (the next launch removes them, #314) are the
      # product's, not test leftovers. Print PDFs go to each test's own folder (#384).
      - name: Tests left no temp files
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          left=$(find "$TMPDIR" -mindepth 1 -maxdepth 1 ! -name 'openstitch-assistant-*')
          if [ -n "$left" ]; then
            echo "::error::The tests left these in the temp folder; use openstitch_testutil::TempDir:"
            echo "$left"
            exit 1
          fi
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The workspace run unifies features; openstitch-render and the thumbnailers build the
      # engine library without its default features, so check that build on its own too (#672;
      # the integration tests use the file formats and digitizing, so they need the defaults).
      - name: Clippy, engine without default features
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p openstitch-engine --no-default-features --lib --locked -- -D warnings
      # Compatibility harness (docs/COMPATIBILITY_TESTS.md): runs compat/specs, fails on a failing
      # or invalid spec or a stale docs/COMPATIBILITY_STATUS.md; specs waiting for a PE-DESIGN
      # reference file are reported as pending, not failed.
      - name: Compatibility specs
        if: matrix.os == 'ubuntu-latest'
        run: cargo run -p stitchtool --locked -- compat --check-status docs/COMPATIBILITY_STATUS.md
      - name: Disk usage (after the tests)
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          { echo "### Disk usage after the tests"; echo '```'; df -h /; du -sh target ~/.cargo 2>/dev/null || true; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compatibility summary
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: if [ -f target/compat/summary.md ]; then cat target/compat/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Compatibility report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: compat-report
          path: |
            target/compat/report.json
            target/compat/summary.md
          if-no-files-found: ignore
          retention-days: 14

  secrets:
    # Secret scan of the whole history with the gitleaks binary (MIT), pinned by version and
    # SHA-256; no gitleaks-action licence is needed. Findings are redacted in the log.
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.24.3
          sha=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_linux_x64.tar.gz"
          echo "$sha  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --log-opts="--all" --redact --no-banner --exit-code 1 .

  icons:
    # Every icon and graphic is a Higgsfield asset with a recorded job (#400, #439): every image
    # file anywhere under assets/ (any folder, a new one too) has a higgsfield-jobs.tsv row
    # beside it or a row in tools/check_assets_allow.tsv (files our tools make from a logo job,
    # jobs not yet recovered), and the app's source has no emoji or symbol button labels and no
    # painter-drawn icons outside tools/check_icons_allow.tsv. Both lists only shrink.
    name: icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: check_icons
        run: python3 tools/check_icons.py
      # The installers' file associations (#356): the MSI's .osd ProgId and .pes Open-with,
      # SupportedTypes and ProgId entries, the .app's Owner (.osd) and Alternate (.pes) document
      # types, and the Linux MIME glob must exist and agree. Builds nothing; runs its self-test first.
      - name: check_file_associations
        run: python3 -I tools/check_file_associations.py
      # readme_status.py refuses inputs holding merge-conflict markers, naming file and line,
      # and warns when the matrix row count drops sharply (#406). Writes nothing.
      - name: readme_status --self-test
        run: python3 -I tools/readme_status.py --self-test
      # Every implemented FEATURE_MATRIX row has a line in README's hand-written Features section
      # (#709): an issue link the row names, or a phrase mapped in tools/readme_features.tsv.
      - name: readme_status --check-features
        run: python3 -I tools/readme_status.py --check-features
      # Feature PRs leave README's generated status blocks alone (#632): the coordinator refreshes
      # them on main in a docs-only PR from a `docs/readme-status-*` branch, which is skipped here.
      - name: readme_status --pr-guard
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'docs/readme-status-')
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          python3 -I tools/readme_status.py --pr-guard "origin/${{ github.base_ref }}"

  web:
    # The editor in a web browser (#556, docs/DISTRIBUTION.md "Web editor"): clippy for
    # wasm32, the release build, wasm-bindgen, then web/smoke.mjs in Node, which opens
    # reference files through the browser build's API and checks that every export is
    # byte-identical to the same steps run natively. The page (web/index.html + pkg/) is
    # uploaded as an artifact; nothing is hosted.
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # The CLI must be the wasm-bindgen version in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: cargo clippy -p openstitch-web --target wasm32-unknown-unknown --locked -- -D warnings
      # The desktop editor's library (editor logic, no window) builds for the browser too (#693
      # phase A1); --no-deps: only the app's own code is linted for wasm32.
      - run: cargo clippy -p openstitch-app --lib --target wasm32-unknown-unknown --no-deps --locked -- -D warnings
      # #693 phase B: the editor window's modules (the binary's, bin_modules.rs) build for
      # wasm32 too, inside the library; the whole package builds there (desktop unchanged).
      - run: cargo build -p openstitch-app --target wasm32-unknown-unknown --locked
      - run: cargo build -p openstitch-web --target wasm32-unknown-unknown --release --locked
      - name: wasm-bindgen (page and Node)
        run: |
          wasm=target/wasm32-unknown-unknown/release/openstitch_web.wasm
          wasm-bindgen --target web --no-typescript --out-dir web/pkg "$wasm"
          wasm-bindgen --target nodejs --no-typescript --out-dir target/web-node "$wasm"
          du -h web/pkg/* | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Smoke test (browser build against the native build)
        shell: bash
        run: |
          inputs=(compat/reference/pes/pes-default-v6.pes compat/reference/pes/pes-0110-stitches.pes compat/reference/stitches/import-rect20x10.dst)
          formats=(pes dst exp vp3 xxx csv gcode)
          mkdir -p target/web-native
          for f in "${inputs[@]}"; do
            cargo run -p openstitch-web --example web_export --locked -- "$f" target/web-native "${formats[@]}"
          done
          node web/smoke.mjs target/web-node target/web-native "${inputs[@]}" -- "${formats[@]}"
      # The page itself in Chromium, Firefox and WebKit (Safari's engine), #694: it starts,
      # "Open…" goes through the browser's file picker and "Export" through a real download,
      # byte-identical to the native build. Playwright is pinned in web/e2e/package-lock.json.
      # Browsers only, no `--with-deps`: that apt step took 57 minutes on a slow mirror.
      # Chromium brings its own software GL. Firefox needs Mesa for WebGL on this GPU-less
      # runner: a small install, given 8 minutes; if it does not finish, Firefox is only warned
      # about. WebKit needs GTK 4 and GStreamer, which the runner lacks: warned about too, and
      # checked on macOS by hand (docs/DISTRIBUTION.md "Web editor").
      - name: Playwright and its browsers
        working-directory: web/e2e
        timeout-minutes: 10
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install chromium firefox webkit
      - name: Mesa for Firefox's WebGL
        id: mesa
        continue-on-error: true
        timeout-minutes: 8
        run: sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 libegl1 libgles2 libgl1-mesa-dri xvfb xauth
      - name: Page test (Chromium, Firefox, WebKit)
        working-directory: web/e2e
        timeout-minutes: 10
        env:
          MESA: ${{ steps.mesa.outcome }}
        run: |
          optional=(--optional webkit)
          if [ "$MESA" != success ]; then
            echo "::warning::Mesa did not install, so Firefox may have no WebGL here"
            optional+=(--optional firefox)
          fi
          # Firefox has WebGL only with a display: it runs headed on a virtual one (Xvfb, Mesa's
          # software GL); Chromium and WebKit stay headless.
          HEADED_FIREFOX=1 xvfb-run -a node page.mjs "${optional[@]}" .. ../../target/web-native ../../compat/reference/pes/pes-default-v6.pes ../../target/web-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openstitch-web-screenshots
          path: target/web-shots/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: openstitch-web
          path: |
            web/index.html
            web/pkg/
          retention-days: 14

  kit:
    # The ready-to-sew kit (examples/sew) must be what the code makes (#450): a fresh release
    # build of every kit design matches the committed .pes files byte for byte, and every
    # committed file passes sew_check. When the stitch engine changes a kit file, regenerate the
    # kit (`python3 -I tools/sew_kit.py`) in the same PR. The previews must show their threads'
    # colours (#564) and every image under docs/images needs a generator (#565).
    name: kit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: kit-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow==11.3.0 numpy==2.3.5
      - name: kit previews show their threads
        # Each preview's pixels include every thread of its design within 20 ΔE (#564).
        run: python -I tools/sew_kit.py --check-previews
      - name: every docs image has a generator
        # tools/docs_images.py regenerates docs/images; a file it can't make fails (#565).
        run: python -I tools/docs_images.py --check
      - run: cargo build --release --locked -p stitchtool
      - name: sew_kit --check
        run: python -I tools/sew_kit.py --check
      - name: Assistant skill examples
        # Every example design of the skill (#492) runs with stitchtool exec, its design.check
        # has no errors, it fits the page, and its PES passes sew_check.
        run: python -I tools/skill_examples.py --stitchtool target/release/stitchtool
      - name: sew_check
        run: python -I tools/sew_check.py examples/sew

  version-label:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.label.outputs.label }}
    steps:
      - id: label
        run: echo "label=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  executables:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: version-label
    uses: ./.github/workflows/build-executables.yml
    with:
      version: ${{ needs.version-label.outputs.label }}
      retention-days: 30
