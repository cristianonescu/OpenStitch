[package]
name = "openstitch-mcp"
description = "Model Context Protocol server (stdio) over the OpenStitch command engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autotests = false

[features]
default = ["remote"]
# The editor's loopback socket (`--live`, the binary) and every engine command, the Design
# Database's too. The browser editor's Assistant (#766) goes without: a page has neither.
remote = ["dep:openstitch-remote", "openstitch-engine/default"]

[[bin]]
name = "openstitch-mcp"
path = "src/main.rs"
required-features = ["remote"]

[dependencies]
base64 = "0.23.1"
openstitch-core.workspace = true
openstitch-design = { path = "../openstitch-design" }
openstitch-engine = { path = "../openstitch-engine", default-features = false, features = ["formats", "digitize"] }
openstitch-remote = { path = "../openstitch-remote", optional = true }
openstitch-render = { path = "../openstitch-render" }
serde_json.workspace = true

[dev-dependencies]
# Temp folders that are removed when a test ends (#366).
openstitch-testutil.workspace = true
png = "0.18.1"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
# The web editor's ui.* command list, for the skill check (#556).
openstitch-web = { path = "../openstitch-web" }

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
