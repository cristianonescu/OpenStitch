[package]
name = "stitchtool"
description = "OpenStitch command-line tool: scripted commands and a JSON-lines control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["formats"]
formats = ["openstitch-engine/formats"]

[dependencies]
openstitch-engine = { path = "../openstitch-engine" }
openstitch-remote = { path = "../openstitch-remote" }
openstitch-compat = { path = "../openstitch-compat" }
# bench-assistant (B17 A5): the assistant's client and tools over a headless editor.
openstitch-assistant = { path = "../openstitch-assistant" }
openstitch-design = { path = "../openstitch-design" }
openstitch-mcp = { path = "../openstitch-mcp" }
openstitch-render = { path = "../openstitch-render" }
base64 = "0.23.1"
serde_json.workspace = true

[dev-dependencies]
# Temp folders that are removed when a test ends (#366).
openstitch-testutil.workspace = true

[lints]
workspace = true
