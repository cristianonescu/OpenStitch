[package]
name = "openstitch-formats"
description = "Embroidery machine file codecs: PES, PEC, DST, EXP, JEF, PCS, SEW, XXX, HUS, VIP, SHV, CSD, VP3, TAP, TBF, U01; PHC, DSB, DSZ, KSM, ZXY, STX (read)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
openstitch-core.workspace = true

# The browser build (#556): the JEF header's time stamp comes from the page's clock, as a
# browser has no system clock for std (SystemTime::now panics there).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"

[dev-dependencies]
serde = { workspace = true }
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
