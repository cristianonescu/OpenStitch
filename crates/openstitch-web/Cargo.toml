[package]
name = "openstitch-web"
description = "OpenStitch in a web browser (WebAssembly): the desktop editor on a WebGL canvas (#556, #693)"
version.workspace = true
edition.workspace = true
license.workspace = true
# eframe 0.37 needs Rust 1.95, as openstitch-app.
rust-version = "1.95"
publish = false

[lib]
# cdylib: the .wasm the browser loads; rlib: the native tests and the export example.
crate-type = ["cdylib", "rlib"]

[dependencies]
openstitch-core.workspace = true
openstitch-design = { path = "../openstitch-design" }
# Without the Design Database (it walks folders and reads the system clock), which stays
# desktop-only (#556).
openstitch-engine = { path = "../openstitch-engine", default-features = false, features = ["formats", "digitize"] }
openstitch-formats = { path = "../openstitch-formats" }
serde_json.workspace = true
# Files passed through `openstitch.run` (the automation API) are base64, as in openstitch-mcp.
base64 = "0.23.1"

# The browser build: the desktop editor (#693) on a WebGL canvas, the file picker, downloads.
[target.'cfg(target_arch = "wasm32")'.dependencies]
openstitch-app = { path = "../openstitch-app" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "HtmlElement", "Blob", "BlobPropertyBag", "Url", "console"] }

[dev-dependencies]
openstitch-testutil.workspace = true

[lints]
workspace = true
