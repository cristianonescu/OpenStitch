[package]
name = "openstitch-compat"
description = "OpenStitch compatibility harness: declarative specs, a semantic embroidery-file comparer, measurements, runner and tiered reports"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
openstitch-core.workspace = true
openstitch-design = { path = "../openstitch-design" }
openstitch-formats = { path = "../openstitch-formats" }
openstitch-engine = { path = "../openstitch-engine" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Temp folders that are removed when a test ends (#366).
openstitch-testutil.workspace = true

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
