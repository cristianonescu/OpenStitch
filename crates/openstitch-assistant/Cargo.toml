[package]
name = "openstitch-assistant"
description = "The OpenStitch AI assistant's model client: streamed Claude Messages or OpenAI-compatible chat completions, and the tool loop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde_json.workspace = true
# Blocking HTTPS client; rustls with the bundled Mozilla roots, no async runtime.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
# Temp folders that are removed when a test ends (#366).
openstitch-testutil.workspace = true

[lints]
workspace = true

# A scripted ACP agent for the tests (no model, no network). `test = false`: it has no tests of
# its own; the release builds name their packages (`-p openstitch-app ...`), so it never ships.
[[bin]]
name = "openstitch-acp-fake-agent"
path = "tests/support/acp_fake_agent.rs"
test = false
doc = false
