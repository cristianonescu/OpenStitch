# Windows Explorer thumbnails for embroidery files (#669): an IThumbnailProvider shell
# extension, a COM DLL that draws with the same renderer as the macOS Quick Look extension and
# `openstitch-thumbnailer` (openstitch_render::thumbnail). A separate project outside the Cargo
# workspace: COM needs unsafe code, which the workspace forbids; the owner's rule lets an OS
# integration use what it needs, kept small and outside the workspace.
[package]
name = "openstitch-explorer-thumbnails"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "openstitch_explorer_thumbnails"
crate-type = ["cdylib", "rlib"]

[dependencies]
openstitch-render = { path = "../../../crates/openstitch-render" }
openstitch-core = { path = "../../../crates/openstitch-core" }
openstitch-formats = { path = "../../../crates/openstitch-formats" }
png = "0.18.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62.2"

[workspace]

[profile.release]
lto = true
codegen-units = 1

[lints.rust]
# MSVC's link.exe notes that DllGetClassObject and DllCanUnloadNow "should be PRIVATE"
# (LNK4104): harmless for a COM server loaded by CLSID, and rustc writes the export list
# itself, so the note is not ours to fix.
linker_messages = "allow"
