[workspace]
resolver = "3"
# Explicit list: a crate joins once its manifest builds, so parallel work never breaks the workspace.
members = [
    "crates/openstitch-core",
    "crates/openstitch-design",
    "crates/openstitch-formats",
    "crates/openstitch-engine",
    "crates/stitchtool",
    "crates/openstitch-mcp",
    "crates/openstitch-app",
    "crates/openstitch-digitize",
    "crates/openstitch-render",
    "crates/openstitch-print",
    "crates/openstitch-library",
    "crates/openstitch-remote",
    "crates/openstitch-compat",
    "crates/openstitch-update",
]
exclude = ["crates/openstitch-formats/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cristianonescu/OpenStitch"
rust-version = "1.88"

[workspace.dependencies]
openstitch-core = { path = "crates/openstitch-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

# Debug and test builds optimise the dependencies and the stitch pipeline (core, design, engine):
# the editor's tests compile the demo design hundreds of times, which took ~45 minutes per CI
# run unoptimised. Debug assertions, overflow checks and debug info stay on.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.openstitch-core]
opt-level = 2

[profile.dev.package.openstitch-design]
opt-level = 2

[profile.dev.package.openstitch-engine]
opt-level = 2
